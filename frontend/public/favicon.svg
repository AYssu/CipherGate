<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- CG字母组合 -->
  <g transform="translate(200, 200)">
    <!-- 字母 C -->
    <path d="M-80 -80 Q-140 -80 -140 0 Q-140 80 -80 80 L-40 80 Q-10 80 -10 50 L-10 30 L-40 30 L-40 50 L-80 50 Q-110 50 -110 0 Q-110 -50 -80 -50 L-40 -50 L-40 -30 L-10 -30 L-10 -50 Q-10 -80 -40 -80 Z" 
          fill="url(#letterGradient)" 
          stroke="url(#strokeGradient)" 
          stroke-width="3"/>
    
    <!-- 字母 G -->
    <path d="M40 -80 Q100 -80 100 -20 L70 -20 Q70 -50 40 -50 Q10 -50 10 0 Q10 50 40 50 L70 50 L70 20 L50 20 L50 0 L100 0 L100 50 Q100 80 70 80 L40 80 Q-20 80 -20 0 Q-20 -80 40 -80 Z" 
          fill="url(#letterGradient)" 
          stroke="url(#strokeGradient)" 
          stroke-width="3"/>
    
    <!-- 装饰性锁图标在G的内部 -->
    <g transform="translate(60, 10)">
      <!-- 小锁体 -->
      <rect x="-6" y="-4" width="12" height="10" rx="2" fill="rgba(255,255,255,0.9)" stroke="none"/>
      
      <!-- 小锁孔 -->
      <circle cx="0" cy="1" r="1.5" fill="url(#letterGradient)"/>
      <rect x="-0.5" y="1" width="1" height="3" fill="url(#letterGradient)"/>
      
      <!-- 小锁环 -->
      <path d="M-4 -4 L-4 -8 Q-4 -10 0 -10 Q4 -10 4 -8 L4 -4" 
            fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- 微妙的光效 -->
    <g opacity="0.3">
      <circle cx="-80" cy="-40" r="3" fill="#00d4aa">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="-40" r="3" fill="#1890ff">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
    </g>
    
    <!-- 连接装饰 -->
    <rect x="-20" y="-3" width="40" height="6" rx="3" fill="url(#connectionGradient)" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <!-- 字母渐变 -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890ff"/>
      <stop offset="50%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0ba360"/>
    </linearGradient>
    
    <!-- 描边渐变 -->
    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#1890ff"/>
    </linearGradient>
    
    <!-- 连接渐变 -->
    <linearGradient id="connectionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#1890ff"/>
    </linearGradient>
  </defs>
</svg>