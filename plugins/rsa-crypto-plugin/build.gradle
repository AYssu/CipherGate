plugins {
    id 'java'
}

group = 'com.ciphergate.plugin'
version = '1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // 添加项目本地 Maven 仓库（如果存在）
    maven { url = uri("${rootProject.projectDir}/.m2/repository") }
}

dependencies {
    compileOnly 'org.pf4j:pf4j:3.14.1'
    // 依赖公共 API 模块（不打包进 JAR，运行时由宿主 classloader 提供）
    compileOnly project(':ciphergate-plugin-api')
    testImplementation project(':ciphergate-plugin-api')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.pf4j:pf4j:3.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes 'Plugin-Class': 'com.ciphergate.plugin.rsa.RsaPlugin'
    }
    from('src/main/resources') {
        include 'plugin.properties'
        include 'plugin-config.*'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}
