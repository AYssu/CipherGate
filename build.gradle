plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ayssu'
version = providers.gradleProperty('releaseVersion').orElse(providers.environmentVariable('RELEASE_VERSION'))
        .getOrElse('0.0.1-SNAPSHOT')
description = 'CipherGate'

springBoot {
    buildInfo {
        excludes = ['time']
    }
}

allprojects {
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { into 'META-INF' }
        from(rootProject.file('NOTICE')) { into 'META-INF' }
    }
}

tasks.named('bootJar') {
    // bootRun keeps local defaults; distributed JARs contain only public configuration.
    exclude '**/application-dev.yaml'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    // 备用镜像（国内网络更稳），mavenCentral 兜底
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "com.baomidou:mybatis-plus-bom:3.5.15"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Swagger (OpenAPI 3) - Springdoc 官方 Swagger UI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14"
    // Knife4j UI（仅前端资源），不引入其 Spring Boot Starter，避免与 Spring Boot 4/Spring 7 不兼容
    implementation "com.github.xiaoymin:knife4j-openapi3-ui:4.5.0"
    implementation "org.webjars:webjars-locator-lite:1.0.0"
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter'
    implementation 'com.baomidou:mybatis-plus-jsqlparser'
    
    // Hutool 工具类（Excel 导出依赖 POI）
    implementation 'cn.hutool:hutool-all:5.8.40'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'com.maxmind.geoip2:geoip2:4.3.1'
    implementation 'org.lionsoul:ip2region:3.3.7'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    //implementation 'com.alibaba.fastjson2:fastjson2:2.0.43'
    // Source: https://mvnrepository.com/artifact/com.alibaba.fastjson2/fastjson2
    implementation "com.alibaba.fastjson2:fastjson2:2.0.61"

    implementation 'org.pf4j:pf4j:3.14.1'
    implementation project(':ciphergate-plugin-api')
    implementation 'io.minio:minio:8.6.0'

    // JWT for portal authentication
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'integration' }
    // Default verification is self-contained; real database tests have an explicit required gate.
    dependsOn ':plugins:example-function-plugin:test', ':plugins:rsa-crypto-plugin:test'
}

tasks.register('unitTest', Test) {
    description = 'Runs backend unit and security tests without external services.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags 'integration' }
    dependsOn ':plugins:example-function-plugin:test', ':plugins:rsa-crypto-plugin:test'
}

tasks.register('integrationTest', Test) {
    description = 'Runs destructive tests against isolated MySQL test databases and a test Redis.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter tasks.named('unitTest')
    doFirst {
        ['MIGRATION', 'CREDENTIAL', 'TRANSFER', 'BOOT'].each { suite ->
            def prefix = "CIPHERGATE_${suite}_JDBC_"
            def jdbcUrl = System.getenv(prefix + 'URL')
            def database = "ciphergate_${suite.toLowerCase()}_test"
            if (!jdbcUrl || !(jdbcUrl ==~ "jdbc:mysql://[^/]+/${database}(\\?.*)?")) {
                throw new GradleException("${prefix}URL must target the isolated ${database} database")
            }
            if (!System.getenv(prefix + 'PASSWORD')) {
                throw new GradleException("${prefix}PASSWORD must be explicitly set")
            }
        }
    }
}

jacoco { toolVersion = '0.8.14' }

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('unitTest')
    mustRunAfter tasks.named('test'), tasks.named('integrationTest')
    executionData fileTree(layout.buildDirectory.dir('jacoco')) { include '*.exec' }
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('unitTest'), tasks.named('integrationTest'), tasks.named('jacocoTestReport')
}
