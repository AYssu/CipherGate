spring:
  application:
    name: CipherGate
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:3s}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/ciphergate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:kersin}
    password: ${SPRING_DATASOURCE_PASSWORD:Jx4zx_aYui23}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8080

springdoc:
  # 规避部分 Spring / springdoc 组合下的 NoSuchMethodError（通用响应覆盖逻辑）
  override-with-generic-response: false

app:
  session:
    # 选填：会话 Cookie 域名（如 .ayssu.com）。不配置则使用当前请求主机，避免与线上域名不匹配。
    cookie-domain: ${APP_SESSION_COOKIE_DOMAIN:}
  backend:
    # 可选：OAuth 授权入口所在后端根 URL（无末尾/）。当前端与后端不同源且 redirect-uri 仍为 Spring 占位符时通过环境变量指定；通常可从已配置的全量 github.oauth2.redirect-uri 自动解析。
    public-base-url: ${APP_BACKEND_PUBLIC_BASE_URL:}
  third-party:
    # 选填：对外网关根 URL（无末尾/），用于检查更新接口（/app/update-check）生成的更新包下载链接。不配则用当前请求的 Host/端口/ContextPath 拼接。
    public-base-url: ${THIRD_PARTY_PUBLIC_BASE_URL:}
  site:
    icp-record-no: ${SITE_ICP_RECORD_NO:}
    public-security-record-no: ${SITE_PUBLIC_SECURITY_RECORD_NO:}
    icp-license-no: ${SITE_ICP_LICENSE_NO:}
  plugin:
    temp-dir: ${PLUGIN_TEMP_DIR:${java.io.tmpdir}/ciphergate-plugins}
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
    access-key: ${MINIO_ACCESS_KEY:ciphergate_minio}
    secret-key: ${MINIO_SECRET_KEY:ciphergate_minio123}
    bucket: ${MINIO_BUCKET:ciphergate-plugins}
