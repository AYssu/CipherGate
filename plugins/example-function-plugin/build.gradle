plugins {
    id 'java'
}

group = 'com.ciphergate.plugin'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // 添加项目本地 Maven 仓库（如果存在）
    maven { url = uri("${rootProject.projectDir}/.m2/repository") }
}

dependencies {
    compileOnly 'org.pf4j:pf4j:3.14.1'
    // 依赖公共 API 模块（不打包进 JAR，运行时由宿主 classloader 提供）
    compileOnly project(':ciphergate-plugin-api')
    // 测试时需要 API 模块
    testImplementation project(':ciphergate-plugin-api')
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes 'Plugin-Class': 'com.ciphergate.plugin.example.ExampleFunctionPluginMain'
    }
    from('src/main/resources') {
        include 'plugin.properties'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
