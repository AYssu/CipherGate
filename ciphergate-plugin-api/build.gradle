plugins {
    id 'java-library'
}

group = 'com.ciphergate'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.pf4j:pf4j:3.14.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
