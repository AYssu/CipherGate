name: Java runtime dependency audit

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    name: Audit complete Java runtime baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve every runtime dependency and audit current advisories
        run: |
          ./gradlew runtimeDependencyInventory --no-daemon
          python3 .github/scripts/audit_java_dependencies.py build/reports/security/runtime-dependencies.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-runtime-security-report
          path: build/reports/security/
          if-no-files-found: warn
          retention-days: 14
