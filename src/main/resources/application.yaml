spring:
  application:
    name: CipherGate
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:3s}
      password: redis_MTXHTx

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbitmq}
    password: ${RABBITMQ_PASSWORD:rabbitmq}
    virtual-host: /

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ciphergate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:ciphergate}
    password: ${SPRING_DATASOURCE_PASSWORD:Qy5S3SBfnRwdKxRD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  docker:
    compose:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8080
  # 仅由内置 RemoteIpValve 规范化可信反向代理头；代码必须使用 request.getRemoteAddr()。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # 仅信任本机与 Docker 默认网段。Nginx 会覆盖 XFF，外部直连伪造头不会生效。
      internal-proxies: '^(?:127(?:\.[0-9]{1,3}){3}|::1|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.[0-9]{1,3}){2})$'

springdoc:
  # 规避部分 Spring / springdoc 组合下的 NoSuchMethodError（通用响应覆盖逻辑）
  override-with-generic-response: false
  swagger-ui:
    # 与 Knife4j 使用同一份 OpenAPI 配置；让 /swagger-ui 与 doc.html 的浏览/调试体验一致。
    doc-expansion: list
    filter: true
    deep-linking: true
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true

app:
  session:
    # 选填：会话 Cookie 域名（如 .ayssu.com）。不配置则使用当前请求主机，避免与线上域名不匹配。
    cookie-domain: ${APP_SESSION_COOKIE_DOMAIN:}
    # 生产启用 HTTPS 时设置 APP_SESSION_COOKIE_SECURE=true。
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
  backend:
    # 可选：OAuth 授权入口所在后端根 URL（无末尾/）。当前端与后端不同源且 redirect-uri 仍为 Spring 占位符时通过环境变量指定；通常可从已配置的全量 github.oauth2.redirect-uri 自动解析。
    public-base-url: ${APP_BACKEND_PUBLIC_BASE_URL:}
  third-party:
    # 选填：对外网关根 URL（无末尾/），用于检查更新接口（/app/update-check）生成的更新包下载链接。不配则用当前请求的 Host/端口/ContextPath 拼接。
    public-base-url: ${THIRD_PARTY_PUBLIC_BASE_URL:}
  site:
    icp-record-no: ${SITE_ICP_RECORD_NO:}
    public-security-record-no: ${SITE_PUBLIC_SECURITY_RECORD_NO:}
    icp-license-no: ${SITE_ICP_LICENSE_NO:}
  plugin:
    temp-dir: ${PLUGIN_TEMP_DIR:${java.io.tmpdir}/ciphergate-plugins}
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio_RcWTQn}
    secret-key: ${MINIO_SECRET_KEY:minio_WfY3PE}
    bucket: ${MINIO_BUCKET:ciphergate-plugins}

portal:
  jwt:
    secret: ${PORTAL_JWT_SECRET:CipherGatePortalJwtSecret2026!@#$%^&*()_+AbCdEfGhIjKlMnOpQrStUvWxYz}
    expiration: ${PORTAL_JWT_EXPIRATION:86400000}
